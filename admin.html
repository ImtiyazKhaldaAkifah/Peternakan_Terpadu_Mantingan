    <form id="form-hapus" action="simpan_produk.php" method="POST" style="display:none;">
        <input type="hidden" name="aksi" value="hapus">
        <input type="hidden" name="id_hapus" id="id_hapus">
    </form>

    <script>
        // Ambil data dari MySQL
fetch('api_products.php')
    .then(res => res.json())
    .then(data => {
        const tabel = document.getElementById('tabel-hewan');
        document.getElementById('total-data').innerText = data.length + ' Item';
        tabel.innerHTML = '';

        data.forEach(h => {
            let hargaIndo = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(h.harga);
            
            // h.id adalah kolom primary key di tabel MySQL kamu
            let jsonStr = JSON.stringify(h).replace(/"/g, '&quot;');

            tabel.innerHTML += `
                <tr>
                    <td class="text-center"><img src="${h.gambar}" class="img-thumb"></td>
                    <td>
                        <div class="fw-bold">${h.nama}</div>
                        <span class="badge-kategori">${h.kategori}</span>
                        <small class="text-muted">(${h.stok} stok)</small>
                    </td>
                    <td class="text-success fw-bold">${hargaIndo}</td>
                    <td class="text-end pe-4">
                        <button onclick="editData(${jsonStr})" class="btn btn-warning btn-sm text-white"><i class="bi bi-pencil-fill"></i></button>
                        <button onclick="hapusData(${h.id}, '${h.nama}')" class="btn btn-danger btn-sm"><i class="bi bi-trash-fill"></i></button>
                    </td>
                </tr>`;
        });
    });

// Fungsi Edit
function editData(data) {
    document.getElementById('judul-form').innerText = "Edit Data";
    document.getElementById('form_aksi').value = "edit";
    document.getElementById('id_hewan').value = data.id; // Pakai data.id
    document.getElementById('nama').value = data.nama;
    document.getElementById('harga').value = data.harga;
    document.getElementById('stok').value = data.stok;
    document.getElementById('kategori').value = data.kategori;
    document.getElementById('gambar').value = data.gambar;
    document.getElementById('deskripsi').value = data.deskripsi;
    
    document.getElementById('btn-submit').innerText = "Update Data";
    document.getElementById('btn-submit').className = "btn btn-warning w-100 mt-2";
    document.getElementById('btn-batal').style.display = "block";
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Fungsi Hapus
function hapusData(id, nama) {
    if(confirm('Yakin hapus ' + nama + '?')) {
        document.getElementById('id_hapus').value = id;
        document.getElementById('form-hapus').submit();
    }
}
    </script>
